name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # UI CI temporarily disabled.
  # ui:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #         cache-dependency-path: UI/package-lock.json
  #     - name: Install UI dependencies
  #       run: npm --prefix UI ci
  #     - name: Test UI
  #       run: npm --prefix UI test
  #     - name: Build UI
  #       run: npm --prefix UI run build
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release --bin fs
      - name: Native CLI integration
        run: |
          BIN=target/release/fs
          if [[ "$RUNNER_OS" == Windows ]]; then BIN="$BIN.exe"; fi
          python tests/integration/test-native.py "$BIN"
          python tests/integration/test-everything.py "$BIN"
          python tests/integration/test-engine-default.py "$BIN"
      - name: Prepare plocate without system-wide indexing
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          timeout 90 sudo apt-get $APT_OPTS update -qq || true
          TOOLS="$RUNNER_TEMP/plocate-tools"
          mkdir -p "$TOOLS/root" "$TOOLS/bin" "$TOOLS/debs"
          cd "$TOOLS/debs"
          apt-get download plocate liburing2
          for deb in *.deb; do
            dpkg-deb -x "$deb" "$TOOLS/root"
          done
          ln -s "$TOOLS/root/usr/bin/plocate" "$TOOLS/bin/plocate"
          ln -s "$TOOLS/root/usr/sbin/updatedb.plocate" "$TOOLS/bin/updatedb"
          ln -s "$TOOLS/root/usr/sbin/plocate-build" "$TOOLS/bin/plocate-build"
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          LIBURING=$(find "$TOOLS/root" -name 'liburing.so.2*' | head -n1)
          test -n "$LIBURING"
          LIBDIR=$(dirname "$LIBURING")
          echo "LD_LIBRARY_PATH=$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Plocate integration
        if: runner.os == 'Linux'
        run: |
          python tests/integration/test-everything.py target/release/fs
          python tests/integration/test-ignore.py target/release/fs
          bash tests/integration/test-e2e.sh target/release/fs
      - name: Check scripts
        run: |
          python -m compileall -q scripts tests/integration
          for script in scripts/benchmarks/*.py scripts/*.py; do
            if [[ "$script" != *common.py ]]; then python "$script" --help > /dev/null; fi
          done
