name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust-engine
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --locked --target "$TARGET" --all-targets -- -D warnings
      - run: cargo test --locked --target "$TARGET" --all-targets
      - run: cargo build --locked --release --target "$TARGET"
      - name: Test release executable
        run: |
          BIN="target/$TARGET/release/nasfind"
          if [[ "$RUNNER_OS" == Windows ]]; then BIN="$BIN.exe"; fi
          python tests/integration/test-native.py "$BIN"
          if [[ "$RUNNER_OS" == Linux ]]; then
            file "$BIN" | grep -E 'statically linked|static-pie linked'
          fi
      - run: python scripts/package-release.py "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist-out/*.tar.gz
            dist-out/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-engine/Cargo.toml", "rb"))["package"]["version"])')
          TAG="v$VERSION"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.tar.gz *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "nasfind $TAG · Linux / macOS / Windows" --notes-file ../rust-engine/INSTALL.md
