name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --target "$TARGET" --all-targets -- -D warnings
      - run: cargo test --locked --workspace --target "$TARGET" --all-targets
      - run: cargo build --locked --release --bin fs --target "$TARGET"
      - name: Test release executable
        run: |
          BIN="target/$TARGET/release/fs"
          if [[ "$RUNNER_OS" == Windows ]]; then BIN="$BIN.exe"; fi
          python tests/integration/test-native.py "$BIN"
          python tests/integration/test-everything.py "$BIN"
          if [[ "$RUNNER_OS" == Linux ]]; then
            file "$BIN" | grep -E 'statically linked|static-pie linked'
          fi
      - run: python scripts/release_package.py "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist-out/*.tar.gz
            dist-out/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          TAG="v$VERSION"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.tar.gz *.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "fs $TAG · Linux / macOS / Windows" --notes-file ../INSTALL.md
