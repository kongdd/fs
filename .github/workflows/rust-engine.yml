name: Rust engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build
      - name: Native CLI integration
        shell: bash
        run: |
          BIN=target/debug/nasfind
          if [[ "$RUNNER_OS" == Windows ]]; then BIN="$BIN.exe"; fi
          python tests/integration/test-native.py "$BIN"
