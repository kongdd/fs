[package]
name = "nasfind"
version = "0.1.0"
edition = "2024"
description = "A tiny multi-database NAS file finder powered by plocate"
license = "MIT"
repository = "https://github.com/kongdd/nasfind"
readme = "README.md"
keywords = ["nas", "plocate", "locate", "search", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
