[package]
name = "fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform filesystem locator"

[dependencies]
fs-locate = { path = "crates/locate" }
fs-updatedb = { path = "crates/updatedb" }
anyhow.workspace = true
clap.workspace = true
toml.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[workspace]
members = ["crates/core", "crates/locate", "crates/updatedb"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/kongdd/fs"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
memchr = "2"
regex = "1.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
