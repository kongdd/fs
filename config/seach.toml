# Mac query: fs -c config/seach.toml locate --mnt soil
# Query only: use updatedb_nas.toml / updatedb_mac.toml for indexing.
# Database formats are detected from their headers; no engine setting is needed.
# Mount NAS /volume1/CMIP6 at /mnt/z before querying.
# Keep each root identical to the indexed root, not its local mount point.
# --mnt maps result paths to /mnt/z, /mnt/x, /mnt/y and /mnt/o.

[[index]]
name = "github"
root = "/volume1/CMIP6/GitHub"
database = "/mnt/z/.fs/github.db"

[[index]]
name = "cmip6"
root = "/volume1/CMIP6"
database = "/mnt/z/.fs/cmip6.db"

[[index]]
name = "github_ssd"
root = "/volume2/GitHub"
database = "/mnt/z/.fs/github_ssd.db"

[[index]]
name = "cug-hydro"
root = "/volume1/CUG-hydro"
database = "/mnt/z/.fs/cug-hydro.db"

[[index]]
name = "researches"
root = "/volume1/Researches"
database = "/mnt/z/.fs/researches.db"

[[index]]
name = "mac"
root = "/Users/kongdd"
database = "/Users/kongdd/.local/var/fs/mac.db"
