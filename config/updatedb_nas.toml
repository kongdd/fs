# NAS: fs -c config/updatedb_nas.toml updatedb -j 8
# Use Rust so macOS can query these databases. New paths leave old plocate DBs intact.
# /volume1/CMIP6 is mounted as /mnt/z on the Mac.
engine = "rust"
outdir = "/volume2/config/fs"

[filters]
# Installed environments, dependency trees, caches and NAS/system metadata.
# Keep project directories and source files; add custom installation paths below.
exclude_dirs = [
  ".git", "node_modules", "target",
  ".julia", ".conda", "anaconda3", "miniconda3", "miniforge3", "mambaforge",
  ".venv", "venv", "site-packages", "__pycache__", ".tox", ".nox",
  "renv", "site-library", "win-library", "x86_64-pc-linux-gnu-library", "R.framework",
  ".cache", ".bun", ".npm", ".pnpm-store", ".node-gyp", ".cargo", ".rustup",
  ".pytest_cache", ".mypy_cache", ".ruff_cache", ".ipynb_checkpoints",
  ".fs", "@eaDir", "#recycle", "$RECYCLE.BIN", ".Trash", ".Trashes", ".Spotlight-V100", ".fseventsd",
  "tiles",
  "build", "dist", ".gradle",
  "typst.ts", "orca", "dify", "moltbot-main", "qwen-code", "whitebox_next_gen",
  "users", "ZWJTEST", "zouyuhe",
  "Hydro-LSTM", "ET_GW_DATA", "DATABASE_WORLD_V3",
  ".pi-subagents",
  "typst-packages",
  # large dirs
  "GSIM_catchments", "GSIM_indices",
  "MSWEP_V280_daily", "hysets", "Boundaries",
  "ChinaHW", "GLDASV2.1", "LP03", "train_samples", # LAI
  "FY4B_1H_Prcp", "PhenoCam_V3",
  "eat_pytorch_in_20_days",
  "backup", "back_up"
]
exclude_extensions = ["tmp", "part", "pyc", "pyo", "rlib", "rmeta"]
# Exact basenames, matched without ASCII case sensitivity.
exclude_files = [".DS_Store", "Thumbs.db", "desktop.ini", ".directory"]

[[index]]
name = "github"
root = "/volume1/CMIP6/GitHub"
# Relative paths are resolved against this index root.
exclude_paths = [
  "kongdd/google-map-downloader/data",
  "users"
]

[[index]]
name = "cmip6"
root = "/volume1/CMIP6"
exclude_paths = ["GitHub"]

[[index]]
name = "github_ssd"
root = "/volume2/GitHub"

[[index]]
name = "cug-hydro"
root = "/volume1/CUG-hydro"

[[index]]
name = "researches"
root = "/volume1/Researches"
