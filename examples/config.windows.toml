# Use absolute paths. A bare drive letter such as C: means that drive's root.
# Databases may live inside the scanned root; the db, its lock, and SQLite sidecars are skipped.
outdir = "C:/fs"

[filters]
exclude_dirs = [".git", "node_modules", "$RECYCLE.BIN", "System Volume Information"]

[[index]]
name = "files"
root = "C:/Users"
