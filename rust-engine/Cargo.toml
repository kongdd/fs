[package]
name = "nasfind"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A byte-safe NAS file finder with a Rust trigram search engine"
license = "MIT"
repository = "https://github.com/kongdd/nasfind"
readme = "README.md"
keywords = ["nas", "indexing", "filename", "search", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "nasfind"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.12"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
